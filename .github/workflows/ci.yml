name: CI

on:
  pull_request:
  push:
    branches:
      - feat/integrated-module-entry

jobs:
  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Edge Function entry
        run: deno check supabase/functions/create-staff-account/index.ts
      - name: Test create-staff-account authorization boundary
        run: node --experimental-strip-types --test supabase/functions/create-staff-account/handler.test.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:module
